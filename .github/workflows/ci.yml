name: "c2.search.reranker CI"

# Run on pull requests to main and on main itself (after a merge), like the
# buildout workflow. Pushing to a branch without a PR does not run the matrix;
# use workflow_dispatch ("Run workflow") to test a branch without a PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Every action is pinned to a full commit SHA of a release that has been out
# for at least two weeks (cooldown). The comment after each SHA is the tag.
#
# The jobs below used to call plone/meta's reusable workflows
# (backend-pytest.yml@2.x / backend-pytest-coverage.yml@2.x). Pinning those by
# SHA would not pin what they call internally (setup_backend_uv@2.x,
# actions/checkout@v7, astral-sh/setup-uv@vX), so their steps are inlined here.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs of the same PR only. A running main build is never
  # cancelled (GitHub keeps at most one pending run per group).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: "Backend: Test (${{ matrix.python-version }}, ${{ matrix.plone-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python-version: '3.10', plone-version: '6.1-latest'}
          - {python-version: '3.11', plone-version: '6.1-latest'}
          - {python-version: '3.12', plone-version: '6.1-latest'}
          - {python-version: '3.13', plone-version: '6.1-latest'}
          - {python-version: '3.10', plone-version: '6.2-latest'}
          - {python-version: '3.11', plone-version: '6.2-latest'}
          - {python-version: '3.12', plone-version: '6.2-latest'}
          - {python-version: '3.13', plone-version: '6.2-latest'}
          - {python-version: '3.14', plone-version: '6.2-latest'}
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      PLONE_VERSION: ${{ matrix.plone-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          cache-python: true
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/mx.ini

      - name: Install codebase
        run: make install

      - name: Run tests with pytest
        run: make test

  coverage:
    name: "Backend: Test Coverage"
    needs: test
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
      PLONE_VERSION: "6.1-latest"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-python: true
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/mx.ini

      - name: Install codebase
        run: make install

      - name: Run coverage
        run: make test-coverage

      - name: Report Coverage
        run: |
          echo "# Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          .venv/bin/coverage report --format markdown >> "$GITHUB_STEP_SUMMARY"
