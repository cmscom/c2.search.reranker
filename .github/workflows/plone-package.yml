# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Plone package (buildout)

# Every action is pinned to a full commit SHA of a release that has been out
# for at least two weeks (cooldown). The comment after each SHA is the tag.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox
      - name: Ruff-Check
        run: |
          tox -r -e ruff-check

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          # Plone 5.2 (buildout + pkg_resources)
          - python-version: '3.8'
            plone-version: 'Plone52'
            tox-envs: 'py38-Plone52'
          # Plone 6.0 (buildout + pkg_resources)
          - python-version: '3.10'
            plone-version: 'Plone60'
            tox-envs: 'py310-Plone60'
          - python-version: '3.11'
            plone-version: 'Plone60'
            tox-envs: 'py311-Plone60'
          # Plone 6.1 (buildout + pkg_resources)
          - python-version: '3.10'
            plone-version: 'Plone61'
            tox-envs: 'py310-Plone61'
          - python-version: '3.11'
            plone-version: 'Plone61'
            tox-envs: 'py311-Plone61'
          - python-version: '3.12'
            plone-version: 'Plone61'
            tox-envs: 'py312-Plone61'
          - python-version: '3.13'
            plone-version: 'Plone61'
            tox-envs: 'py313-Plone61'
          # Plone 6.2 (buildout + pkg_resources)
          - python-version: '3.10'
            plone-version: 'Plone62'
            tox-envs: 'py310-Plone62'
          - python-version: '3.11'
            plone-version: 'Plone62'
            tox-envs: 'py311-Plone62'
          - python-version: '3.12'
            plone-version: 'Plone62'
            tox-envs: 'py312-Plone62'
          - python-version: '3.13'
            plone-version: 'Plone62'
            tox-envs: 'py313-Plone62'
          - python-version: '3.14'
            plone-version: 'Plone62'
            tox-envs: 'py314-Plone62'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/buildout-cache
            ~/extends
          key: ${{ runner.os }}-tox-${{ matrix.python-version }}-${{ matrix.plone-version }}-${{ hashFiles('**/pyproject.toml') }}-${{ hashFiles('**/requirements*.txt') }}-${{ hashFiles('**/*.cfg') }}-${{ hashFiles('**/constraints*.txt') }}-${{ hashFiles('**/tox.ini') }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup buildout cache
        run: |
          mkdir -p ~/buildout-cache/{eggs,downloads}
          mkdir -p ~/.buildout
          echo "[buildout]" > $HOME/.buildout/default.cfg
          echo "download-cache = $HOME/buildout-cache/downloads" >> $HOME/.buildout/default.cfg
          echo "eggs-directory = $HOME/buildout-cache/eggs" >> $HOME/.buildout/default.cfg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox
      - name: Test with tox
        run: |
          tox -r -e ${{ matrix.tox-envs }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: false
        if: matrix.python-version == '3.11'
