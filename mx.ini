; This is a mxdev configuration file
; it can be used to override versions of packages already defined in the
; constraints files and to add new packages from VCS like git.
; to learn more about mxdev visit https://pypi.org/project/mxdev/

[settings]
main-package = -e .[test]
; example how to override a package version
; version-overrides =
;     example.package==2.1.0a2
;
; Plone 6.1-latest constraints pin filelock twice with different versions
; (3.25.0 from Zope's constraints, 3.29.0 from Plone's constraints-extra.txt).
; filelock is only needed through collective.vectorsearch -> fastembed ->
; huggingface-hub, and the conflict makes the whole install unsatisfiable.
; The override applies to every Plone version, so 6.2-latest (which pins
; filelock==3.32.2 only once) also gets 3.29.0; that combination is tested too.
; Remove this override once the upstream constraints agree.
version-overrides =
    filelock==3.29.0

[collective.vectorsearch]
url = https://github.com/collective/collective.vectorsearch.git
branch = main

; example section to use packages from git
; [example.contenttype]
; url = https://github.com/collective/example.contenttype.git
; pushurl = git@github.com:collective/example.contenttype.git
; extras = test
; branch = master
