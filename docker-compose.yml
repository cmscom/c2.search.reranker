version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SITE: "Plone"
      TYPE: "classic"
      DEVELOP: "/workspace"
      PROFILES: "c2.search.reranker:default"
      # 開発で作り直したいときだけ（普段は外す）
      # DELETE_EXISTING: "true"
    volumes:
      - .:/workspace:cached
      - data:/data
    # rootユーザーで起動し、/workspaceのパーミッション修正後にploneユーザーで作業
    user: root
    entrypoint:
      - /bin/bash
      - -c
      - |
        chown -R plone:plone /workspace
        exec gosu plone /bin/bash -c "sleep infinity"
    # command: ["start"]
    # entrypoint: ["/bin/bash", "-c", "sleep infinity"]

volumes:
  data: {}
